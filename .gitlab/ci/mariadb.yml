# Migrations and schema rules on a real MariaDB (api/tests/test_mariadb_*.py; without a server those tests skip,
# which is why the plain API job does not run them). Used by checks.yml with the image that docker-compose.yml
# pins, and by the weekly mariadb-versions job with the moving tags.

.mariadb-tests:
  image: python:3.14
  services:
    - name: $MARIADB_IMAGE
      alias: mariadb
  variables:
    # The MariaDB service receives the job's variables, so this sets its root password.
    MARIADB_ROOT_PASSWORD: ci
    # What the API tests need to import the code (the same block as in checks.yml; the jobs here are also used
    # by the root pipeline, which does not include that file's variables).
    GOD_ADMIN_PASS: ci
    MARIADB_HOST: localhost
    MARIADB_DATABASE: ci
    MARIADB_USER: ci
    MARIADB_PASSWORD: ci
    SECRET_KEY: ci-secret
    ACCESS_TOKEN_EXPIRE_MINUTES: "60"
    CORS_ORIGINS: "[]"
    SENTRY_URL_API: ""
    ENVIRONMENT: test
    API_LOG_LEVEL: INFO
    TEST_MARIADB_URL: mysql+pymysql://root:ci@mariadb:3306
    REQUIRE_MARIADB_TESTS: "1"
    EXPECT_MARIADB_PIN: ""
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache:
    key: { files: [api/requirements.txt], prefix: pip-api }
    paths: [.cache/pip]
  script:
    - cd api
    - pip install -r requirements.txt
    - python ../.gitlab/scripts/mariadb_wait.py
    - python -m unittest discover -s tests -t . -p "test_mariadb_*.py"
