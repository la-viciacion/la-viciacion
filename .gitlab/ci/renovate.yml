# Dependency updates, the equivalent of .github/dependabot.yml: GitLab has no Dependabot, so Renovate runs as a
# scheduled job and opens the merge requests (the rules are in renovate.json5 at the root).
# Needs a pipeline schedule (Build > Pipeline schedules, e.g. daily) with the variable SCHEDULE_JOB=renovate, and the
# CI/CD variable RENOVATE_TOKEN (a project access token, role Developer, scopes api + write_repository; Masked).
# Pin the image to a release once you pick one: it is `latest` here only because none was verified.

renovate:
  stage: prepare
  image:
    name: renovate/renovate:latest
    entrypoint: [""]
  interruptible: false
  variables:
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: $CI_API_V4_URL
    RENOVATE_REPOSITORIES: $CI_PROJECT_PATH
    RENOVATE_AUTODISCOVER: "false"
    RENOVATE_ONBOARDING: "false"
    RENOVATE_REQUIRE_CONFIG: required
    LOG_LEVEL: info
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_JOB == "renovate"
  script:
    - renovate
