# Everything a change must pass before it can reach main (child pipeline of .gitlab-ci.yml: generated by
# ci-scope.sh on a merge request, run in full by release-checks on a tag). The jobs read two variables that the
# parent provides: SCOPE ("all", "none" or a comma-separated subset of api-tests, bot-tests, front-tests, mariadb)
# and BUILD_SERVICES (a JSON list of the images to build and inspect).

stages: [pin, test, build]

include:
  - local: .gitlab/ci/mariadb.yml

variables:
  # What the API tests need to import the code; they never connect to anything.
  GOD_ADMIN_PASS: ci
  MARIADB_HOST: localhost
  MARIADB_DATABASE: ci
  MARIADB_USER: ci
  MARIADB_PASSWORD: ci
  SECRET_KEY: ci-secret
  ACCESS_TOKEN_EXPIRE_MINUTES: "60"
  CORS_ORIGINS: "[]"
  SENTRY_URL_API: ""
  ENVIRONMENT: test
  API_LOG_LEVEL: INFO
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"

default:
  interruptible: true

# A child pipeline with no job at all (scope none, nothing to build) cannot be created, so this one always exists.
scope:
  stage: pin
  image: alpine:3
  script:
    - 'echo "scope=$SCOPE build_services=$BUILD_SERVICES"'

api-tests:
  stage: test
  image: python:3.14
  rules:
    - if: $SCOPE == "all" || $SCOPE =~ /(^|,)api-tests(,|$)/
  cache:
    key: { files: [api/requirements.txt], prefix: pip-api }
    paths: [.cache/pip]
  script:
    # unused or undefined names and likely bugs (ruff.toml at the root says which); the version is pinned so
    # a new release cannot turn a green check red on its own
    - pip install ruff==0.16.3
    - ruff check api
    - cd api
    - pip install -r requirements.txt
    - python -m unittest discover -s tests -t .

bot-tests:
  stage: test
  image: python:3.14
  rules:
    - if: $SCOPE == "all" || $SCOPE =~ /(^|,)bot-tests(,|$)/
  cache:
    key: { files: [bot/requirements.txt], prefix: pip-bot }
    paths: [.cache/pip]
  script:
    - pip install ruff==0.16.3
    - ruff check bot
    - cd bot
    - pip install -r requirements.txt
    - python -m unittest discover -s tests -t .

front-tests:
  stage: test
  image: node:24
  rules:
    - if: $SCOPE == "all" || $SCOPE =~ /(^|,)front-tests(,|$)/
  cache:
    key: { files: [front/package-lock.json], prefix: npm-front }
    paths: [.cache/npm]
  script:
    - cd front
    - npm ci
    - npm test
    - npm run lint

# The MariaDB that docker-compose.yml pins is the one the tests run on: it is read from there, so what is
# tested and what is deployed cannot drift apart.
mariadb-image:
  stage: pin
  image: alpine:3
  rules:
    - if: $SCOPE == "all" || $SCOPE =~ /(^|,)mariadb(,|$)/
  script:
    - sh .gitlab/scripts/mariadb-pin.sh
  artifacts:
    reports:
      dotenv: mariadb-image.env

api-mariadb:
  extends: .mariadb-tests
  stage: test
  needs: [mariadb-image]   # brings MARIADB_IMAGE from the dotenv report
  rules:
    - if: $SCOPE == "all" || $SCOPE =~ /(^|,)mariadb(,|$)/
  variables:
    EXPECT_MARIADB_PIN: "1"

# Build every image and look inside it before anything is published.
.build:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker build -t "check/$SERVICE" "$SERVICE"
    - sh .gitlab/scripts/image-checks.sh "check/$SERVICE"

build-api:
  extends: .build
  variables: { SERVICE: api }
  rules:
    - if: $BUILD_SERVICES =~ /"api"/

build-front:
  extends: .build
  variables: { SERVICE: front }
  rules:
    - if: $BUILD_SERVICES =~ /"front"/

build-bot:
  extends: .build
  variables: { SERVICE: bot }
  rules:
    - if: $BUILD_SERVICES =~ /"bot"/
