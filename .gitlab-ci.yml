# GitLab CI/CD, the equivalent of .github/workflows/. PREPARED, NOT IN USE: the repository lives on GitHub and these
# files do nothing there. They are kept in step with the workflows so a move to GitLab is a push, not a rewrite;
# docs/gitlab.md has the project settings to make, the CI/CD variables and what was not tried.
#
#   GitHub                      GitLab
#   ci.yml (pull_request)       merge request pipeline: pr-title, changes -> checks (child pipeline)
#   checks.yml                  .gitlab/ci/checks.yml
#   mariadb-tests.yml/versions  .gitlab/ci/mariadb.yml
#   release.yml (tag v*)        release-checks + publish (below)
#   deploy.yml (dispatch)       .gitlab/ci/deploy.yml  (Build > Pipelines > Run pipeline, on main)
#   dependabot.yml              renovate.json5 + .gitlab/ci/renovate.yml (a scheduled pipeline)
#
# The required "CI" status becomes the project setting "Pipelines must succeed": a merge request pipeline is green
# only if every job (and the child pipeline) passed, and skipped jobs do not count against it.

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    - when: never   # a plain push to a branch runs nothing, as on GitHub: only pull requests and tags do

stages: [prepare, checks, release, deploy]

default:
  interruptible: true

# Offered in the "Run pipeline" form (Build > Pipelines > Run pipeline) to deploy; see .gitlab/ci/deploy.yml.
variables:
  DEPLOY_TARGET:
    value: "none"
    options: ["none", "dev", "prod"]
    description: "Where to deploy. Run the pipeline on main (dev builds main; prod builds the release tag below)"
  DEPLOY_VERSION:
    value: "latest"
    description: "prod only: release to deploy, `latest` or X.Y.Z (also how you roll back)"

include:
  - local: .gitlab/ci/mariadb.yml
  - local: .gitlab/ci/deploy.yml
  - local: .gitlab/ci/renovate.yml

# ---- merge requests -----------------------------------------------------------------------------------------------

# Merge requests are squash-merged, so the title becomes the commit message on main.
pr-title:
  stage: prepare
  image: alpine:3
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - sh .gitlab/scripts/pr-title.sh

# What the merge request touches decides which checks run; anything unclassified runs them all (the rules and the
# reasons are in .github/scripts/ci_scope.py, the same script as on GitHub). Writes the child pipeline.
changes:
  stage: prepare
  image: python:3.14
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - sh .gitlab/scripts/ci-scope.sh
  artifacts:
    paths: [child.yml]
    expire_in: 1 day

checks:
  stage: checks
  needs: [changes]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  trigger:
    include:
      - artifact: child.yml
        job: changes
    strategy: depend   # this job (and so the pipeline) fails when the child pipeline does

# Early warning, not a gate: once a week the MariaDB tests run against the moving tags, `lts` (the series
# docker-compose.yml pins, at its newest patch) and `latest` (the next release). If one fails, a release of MariaDB
# changed something we depend on, and it is known before anyone has to move to it. Merge requests are only gated by
# the pinned version, so a MariaDB release never turns an unrelated one red.
# Needs a pipeline schedule (Build > Pipeline schedules) with the variable SCHEDULE_JOB=mariadb-versions.
mariadb-versions:
  extends: .mariadb-tests
  stage: checks
  interruptible: false
  parallel:
    matrix:
      - MARIADB_IMAGE: ["mariadb:lts", "mariadb:latest"]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_JOB == "mariadb-versions"

# ---- release: a tag vX.Y.Z (or a manual pipeline run on a tag) ---------------------------------------------------

# The one full run: a merge request only runs what its files can affect, and main is not tested again after a merge.
# The prod deploy only accepts a tag whose pipeline passed (.gitlab/scripts/verify-release.sh).
release-checks:
  stage: checks
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  interruptible: false
  variables:
    SCOPE: all
    BUILD_SERVICES: '["api","front","bot"]'
  trigger:
    include: .gitlab/ci/checks.yml
    strategy: depend

# Only for a real tag push (never a manual try-out) and only once publishing is switched on with the CI/CD variable
# PUBLISH_IMAGES=true. Images go to the project's own registry: $CI_REGISTRY_IMAGE/laviciacion-<service>.
publish:
  stage: release
  needs: [release-checks]
  image: docker:27
  services: [docker:27-dind]
  interruptible: false
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  parallel:
    matrix:
      - SERVICE: [api, front, bot]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/ && $CI_PIPELINE_SOURCE == "push" && $PUBLISH_IMAGES == "true"
  script:
    - sh .gitlab/scripts/publish.sh
