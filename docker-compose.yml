# Production pulls the images the release workflow publishes (set LAVI_VERSION in .env to pin
# one, e.g. 2.0.0): `docker compose pull && docker compose up -d`. For development
# `docker compose up -d --build` builds them from the Dockerfiles and tags them with the same names.
# The images hold no configuration: it all arrives at run time (env_file / environment).

# What Docker keeps of each container's output: the API logs every request, so without a cap its log file
# grows for as long as the container lives. Three files of 10 MB each, the oldest dropped.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  laviciacion-front:
    build: ./front
    image: ghcr.io/la-viciacion/laviciacion-front:${LAVI_VERSION:-latest}
    container_name: laviciacion-front
    restart: unless-stopped
    logging: *logging
    # Where /api is proxied to: the one thing the front needs to know. The image does not get
    # the whole .env (it holds secrets the front must not see), only these.
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-http://laviciacion-api:5000}
      DNS_RESOLVER: ${DNS_RESOLVER:-127.0.0.11}
    networks:
      - la-viciacion
    # Host side of the port: FRONT_HOST_IP (default: every interface) and FRONT_HOST_PORT.
    ports:
      - target: 3000
        published: ${FRONT_HOST_PORT:-3000}
        host_ip: ${FRONT_HOST_IP:-0.0.0.0}

  laviciacion-bot:
    build: ./bot
    image: ghcr.io/la-viciacion/laviciacion-bot:${LAVI_VERSION:-latest}
    container_name: laviciacion-bot
    env_file: .env
    restart: unless-stopped
    logging: *logging
    volumes:
      - ./bot/logs:/app/logs
    networks:
      - la-viciacion
    depends_on:
      laviciacion-api:
        condition: service_healthy

  laviciacion-api:
    build: ./api
    image: ghcr.io/la-viciacion/laviciacion-api:${LAVI_VERSION:-latest}
    container_name: laviciacion-api
    env_file: .env
    # Where the server page reads the machine's memory, disk and load from: the monitoring services below when their
    # profile is on (COMPOSE_PROFILES=monitoring in the .env), or the PROMETHEUS_URL of the .env for a Prometheus elsewhere.
    # Empty, the page shows only what Hetzner gives.
    environment:
      PROMETHEUS_URL: ${PROMETHEUS_URL:-${COMPOSE_PROFILES:+http://laviciacion-prometheus:9090}}
    restart: unless-stopped
    logging: *logging
    volumes:
      - ./api/logs:/app/logs
    networks:
      - la-viciacion
    # The front proxies /api to this container; the port is only published on
    # localhost for direct access (curl, docs, admin sync).
    ports:
      - target: 5000
        published: ${API_HOST_PORT:-5000}
        host_ip: ${API_HOST_IP:-127.0.0.1}
    depends_on:
      laviciacion-db:
        condition: service_healthy
    healthcheck:
      # the image has no curl: Python asks the keepalive (not logged). The migrations run before uvicorn starts and
      # may take minutes, hence the long start period
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/v1/keepalive', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s
      start_interval: 5s

  laviciacion-db:
    image: mariadb:12.3.3
    container_name: laviciacion-db
    env_file: .env
    restart: unless-stopped
    logging: *logging
    volumes:
      # Where MariaDB keeps its data. Default: the ./db/data folder (a bind mount: what a Linux
      # server should use). On Windows/Docker Desktop that folder is a network-like share on which
      # MariaDB 12+ cannot rebuild tables (migration 012 fails), so there set DB_DATA in .env to a
      # plain name (e.g. laviciacion_db_data): Docker then uses a named volume instead.
      - ${DB_DATA:-./db/data}:/var/lib/mysql
      # Any .sql/.sql.gz/.sh dropped here is imported automatically by
      # MariaDB, but ONLY the first time it starts up (empty ./db/data).
      # Use it to seed a fresh environment from a pre-migration backup.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - la-viciacion
    # Only published on localhost (DB clients, backups).
    ports:
      - target: 3306
        published: ${DB_HOST_PORT:-3307}
        host_ip: ${DB_HOST_IP:-127.0.0.1}
    healthcheck:
      # MARIADB_HOST (from .env) makes the client dial the container IP instead
      # of the local socket, where the healthcheck user has no grant.
      test: ["CMD-SHELL", "MARIADB_HOST=localhost healthcheck.sh --connect --innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # --- Server monitoring (OPTIONAL): only started with COMPOSE_PROFILES=monitoring in the .env ---
  # Prometheus + node-exporter, to see the machine's RAM, disk space, load and CPU with history (the Hetzner API gives none
  # of the first two). Both live in the stack's network and publish no port, so they need no firewall rule: Prometheus
  # (prometheus/prometheus.yml) reaches node-exporter by name and the API reaches Prometheus as laviciacion-prometheus.
  # node-exporter shares the host's PID namespace and sees its root read-only, which is what makes its memory, disk, load
  # and CPU figures the machine's; its network figures are the container's, so the panel takes the network from Hetzner.

  laviciacion-node-exporter:
    profiles: [monitoring]
    image: prom/node-exporter:v1.9.1
    container_name: laviciacion-node-exporter
    restart: unless-stopped
    logging: *logging
    pid: host
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
    networks:
      - la-viciacion

  laviciacion-prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v3.5.0
    container_name: laviciacion-prometheus
    restart: unless-stopped
    logging: *logging
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # the server page shows up to 30 days; a little more so a chart never ends short
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-35d}
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - laviciacion_prometheus_data:/prometheus
    networks:
      - la-viciacion
    depends_on:
      - laviciacion-node-exporter
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  la-viciacion:
    # A fixed range, so FORWARDED_ALLOW_IPS (which names it) keeps matching when the network is recreated, and
    # so two stacks on one host (production and dev) can be told apart: give each its own LAVI_SUBNET.
    ipam:
      config:
        - subnet: ${LAVI_SUBNET:-192.168.64.0/20}

volumes:
  # only created when DB_DATA names it (see the db service)
  laviciacion_db_data:
  # only used by the monitoring profile
  laviciacion_prometheus_data:
