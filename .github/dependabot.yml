version: 2

# Weekly, grouped so a week of updates is one PR per ecosystem instead of a dozen, and each ecosystem on
# its own weekday so the PRs rarely coexist (main requires branches to be up to date: a PR that is
# still open when another one merges has to be rebased, see docs/workflow.md). Every PR goes
# through the same CI as any other change. Titles use the Conventional Commits prefix the PR title
# check requires.
updates:
  - package-ecosystem: pip
    directory: /api
    schedule: { interval: weekly, day: monday, time: "07:00", timezone: Europe/Madrid }
    commit-message: { prefix: "chore(api)" }
    groups:
      api-dependencies:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /bot
    schedule: { interval: weekly, day: tuesday, time: "07:00", timezone: Europe/Madrid }
    commit-message: { prefix: "chore(bot)" }
    groups:
      bot-dependencies:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /front
    schedule: { interval: weekly, day: wednesday, time: "07:00", timezone: Europe/Madrid }
    commit-message: { prefix: "chore(front)" }
    groups:
      front-dependencies:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: thursday, time: "07:00", timezone: Europe/Madrid }
    commit-message: { prefix: "ci" }
    groups:
      actions:
        update-types: [minor, patch]

  # Base images. The Python major/minor (3.14 for api and bot) is a deliberate decision that must
  # match the CI jobs, so only patch-level changes arrive on their own.
  - package-ecosystem: docker
    directory: /api
    schedule: { interval: weekly, day: friday, time: "07:00", timezone: Europe/Madrid }
    commit-message: { prefix: "chore(api)" }
    ignore:
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]

  - package-ecosystem: docker
    directory: /bot
    schedule: { interval: weekly, day: friday, time: "07:00", timezone: Europe/Madrid }
    commit-message: { prefix: "chore(bot)" }
    ignore:
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]

  - package-ecosystem: docker
    directory: /front
    schedule: { interval: weekly, day: friday, time: "07:00", timezone: Europe/Madrid }
    commit-message: { prefix: "chore(front)" }
