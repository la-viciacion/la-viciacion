name: Checks

# Everything a change must pass before it can reach main (called by ci.yml on every PR) and
# before a release (called by release.yml). ci.yml narrows it to what a pull request touches
# (.github/scripts/ci_scope.py decides); called without inputs, as release.yml does, it runs everything.
on:
  workflow_call:
    inputs:
      scope:
        description: "The checks to run: all, or a comma-separated subset of api-tests, bot-tests, front-tests, mariadb, mariadb-migrations, or none"
        type: string
        default: all
      build-services:
        description: JSON list of the images to build and inspect
        type: string
        default: '["api","front","bot"]'

permissions:
  contents: read

env:
  # What the API tests need to import the code; they never connect to anything.
  GOD_ADMIN_PASS: ci
  MARIADB_HOST: localhost
  MARIADB_DATABASE: ci
  MARIADB_USER: ci
  MARIADB_PASSWORD: ci
  SECRET_KEY: ci-secret
  ACCESS_TOKEN_EXPIRE_MINUTES: "60"
  CORS_ORIGINS: "[]"
  SENTRY_URL_API: ""
  ENVIRONMENT: test
  API_LOG_LEVEL: INFO

jobs:
  api-tests:
    if: inputs.scope == 'all' || contains(format(',{0},', inputs.scope), ',api-tests,')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - name: API tests
        working-directory: api
        run: |
          pip install -r requirements.txt
          python -m unittest discover -s tests -t .

  bot-tests:
    if: inputs.scope == 'all' || contains(format(',{0},', inputs.scope), ',bot-tests,')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: bot/requirements.txt
      - name: Bot tests
        working-directory: bot
        run: |
          pip install -r requirements.txt
          python -m unittest discover -s tests -t .

  front-tests:
    if: inputs.scope == 'all' || contains(format(',{0},', inputs.scope), ',front-tests,')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: front/package-lock.json
      - name: Front tests and lint
        working-directory: front
        run: |
          npm ci
          npm test
          npm run lint

  # The MariaDB that docker-compose.yml pins is the one the tests run on: it is read from there, so what is
  # tested and what is deployed cannot drift apart.
  mariadb-image:
    if: inputs.scope == 'all' || contains(format(',{0},', inputs.scope), ',mariadb,') || contains(format(',{0},', inputs.scope), ',mariadb-migrations,')
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.pin.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - id: pin
        run: |
          image=$(sed -n 's/^ *image: *\(mariadb:[^ ]*\) *$/\1/p' docker-compose.yml)
          if [ -z "$image" ] || [ "$(printf '%s\n' "$image" | wc -l)" != 1 ]; then
            echo "::error::docker-compose.yml must name exactly one mariadb image, with an explicit tag"; exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

  # Routes, scheduler, app boot...: on every change of the API.
  api-mariadb:
    needs: mariadb-image
    if: inputs.scope == 'all' || contains(format(',{0},', inputs.scope), ',mariadb,')
    uses: ./.github/workflows/mariadb-tests.yml
    with:
      image: ${{ needs.mariadb-image.outputs.image }}
      tests: routes
      expect-pin: true

  # The migrations (most of the time of the MariaDB tests): only when something they depend on changes.
  api-mariadb-migrations:
    needs: mariadb-image
    if: inputs.scope == 'all' || contains(format(',{0},', inputs.scope), ',mariadb-migrations,')
    uses: ./.github/workflows/mariadb-tests.yml
    with:
      image: ${{ needs.mariadb-image.outputs.image }}
      tests: migrations
      expect-pin: true

  # Build every image and look inside it before anything is published.
  build:
    if: inputs.build-services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(inputs.build-services) }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service }}
          load: true
          tags: check/${{ matrix.service }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

      - name: The image holds no secrets, data or configuration files
        run: |
          image=check/${{ matrix.service }}

          # files that must never end up in an image. Only the directories that exist in that image
          # are searched (the api and bot have /app, the front has the web root): find exits 1 for a
          # missing path, which under `bash -e` would end this step silently.
          found=$(docker run --rm --entrypoint sh "$image" -c \
            'for dir in /app /usr/share/nginx/html; do
               [ -d "$dir" ] && find "$dir" \( -name ".env" -o -name ".env.*" -o -name "*.sql" -o -name "*.sql.gz" -o -name "*.dump" \)
             done; true')
          if [ -n "$found" ]; then
            echo "::error::sensitive files inside the image:"; echo "$found"; exit 1
          fi

          # variables baked in with ENV/ARG: nothing that looks like a credential (GPG_KEY is the
          # public key id of the official python image)
          baked=$(docker image inspect "$image" --format '{{range .Config.Env}}{{println .}}{{end}}' \
            | cut -d= -f1 | grep -i -E 'PASS|SECRET|TOKEN|KEY' | grep -v -x GPG_KEY || true)
          if [ -n "$baked" ]; then
            echo "::error::credential-looking variables baked into the image:"; echo "$baked"; exit 1
          fi
          echo "clean"
