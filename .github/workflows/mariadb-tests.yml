name: MariaDB tests

# The tests on a real MariaDB (api/tests/test_mariadb_*.py; without a server those tests skip, which is why the
# plain API job does not run them), in two sets: the migration ones (test_mariadb_migration*.py: they run
# alembic dozens of times, so they are most of the time) and everything else (routes, scheduler, app boot...).
# Called by checks.yml with the image that docker-compose.yml pins, once per set, and by mariadb-versions.yml
# with the moving tags, for both.
on:
  workflow_call:
    inputs:
      image:
        description: The MariaDB image to test against, with its tag (mariadb:12.3.3)
        required: true
        type: string
      tests:
        description: "The set to run: routes (everything but the migration tests), migrations or all"
        required: false
        type: string
        default: all
      expect-pin:
        description: Fail unless the server is the version docker-compose.yml pins
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  # What the API tests need to import the code (a called workflow does not inherit the caller's env, so
  # this is the same block as in checks.yml). The tests that need a database use TEST_MARIADB_URL below.
  GOD_ADMIN_PASS: ci
  MARIADB_HOST: localhost
  MARIADB_DATABASE: ci
  MARIADB_USER: ci
  MARIADB_PASSWORD: ci
  SECRET_KEY: ci-secret
  ACCESS_TOKEN_EXPIRE_MINUTES: "60"
  CORS_ORIGINS: "[]"
  SENTRY_URL_API: ""
  ENVIRONMENT: test
  API_LOG_LEVEL: INFO

jobs:
  tests:
    name: ${{ inputs.image }} (${{ inputs.tests }})
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: ${{ inputs.image }}
        env:
          MARIADB_ROOT_PASSWORD: ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      TEST_MARIADB_URL: mysql+pymysql://root:ci@127.0.0.1:3306
      REQUIRE_MARIADB_TESTS: "1"
      EXPECT_MARIADB_PIN: ${{ inputs.expect-pin && '1' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - name: Install
        working-directory: api
        run: pip install -r requirements.txt
      - name: Server under test
        working-directory: api
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          with create_engine(os.environ["TEST_MARIADB_URL"]).connect() as conn:
              print("image:  ${{ inputs.image }}")
              print("server:", conn.execute(text("SELECT VERSION()")).scalar())
          PY
      - name: API tests (${{ inputs.tests }}) on ${{ inputs.image }}
        working-directory: api
        env:
          SET: ${{ inputs.tests }}
        run: |
          # the set is decided by the file name (tests/test_ci_scope.py pins it); an empty selection is an error
          selected=""
          for file in tests/test_mariadb_*.py; do
            migration=false
            case "$file" in tests/test_mariadb_migration*) migration=true ;; esac
            case "$SET" in
              all) take=true ;;
              migrations) take=$migration ;;
              routes) if [ "$migration" = true ]; then take=false; else take=true; fi ;;
              *) echo "::error::unknown set '$SET'"; exit 1 ;;
            esac
            if [ "$take" = true ]; then
              module=${file%.py}
              selected="$selected ${module//\//.}"
            fi
          done
          [ -n "$selected" ] || { echo "::error::no test file in the set '$SET'"; exit 1; }
          echo "running:$selected"
          python -m unittest $selected
