name: Release images
run-name: Release ${{ github.ref_name }}

# Creating a tag `vX.Y.Z` runs every check, whatever the PRs that led to it touched: it is the one full run
# (a PR only runs what its files can affect, and main is not tested again after a merge). Once they pass, a
# stable tag (vX.Y.Z, no suffix) is deployed to prod by itself through deploy.yml; a manual run never deploys,
# and neither does a prerelease tag. If the repository variable PUBLISH_IMAGES is
# `true` it then publishes the api, front and bot images to GHCR
# (ghcr.io/<owner>/laviciacion-<service>:X.Y.Z, X.Y and latest); without it the tag is only checked,
# because for now the server builds the tag itself (see docs/desarrollo/deployment.md). Run by hand ("Run workflow")
# it does everything except publish, to try the build without a tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  # deploy.yml takes X.Y.Z and only deploys stable releases: an empty version (a prerelease tag, a manual run) skips the deploy.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF" == refs/tags/v* && "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: [checks, version]
    if: needs.version.outputs.version != ''
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/deploy.yml
    with:
      target: prod
      version: ${{ needs.version.outputs.version }}
    secrets: inherit

  publish:
    # Only for a real tag, never for a manual try-out, and only once publishing has been switched on.
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_IMAGES == 'true'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [api, front, bot]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/laviciacion-${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service }}
          push: true
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
