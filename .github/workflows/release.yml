name: Release images

# Creating a tag `vX.Y.Z` runs every check, whatever the PRs that led to it touched: it is the one full run
# (a PR only runs what its files can affect, and main is not tested again after a merge). The prod deploy
# only accepts a tag whose run here passed (deploy.yml). If the repository variable PUBLISH_IMAGES is
# `true` it then publishes the api, front and bot images to GHCR
# (ghcr.io/<owner>/laviciacion-<service>:X.Y.Z, X.Y and latest); without it the tag is only checked,
# because for now the server builds the tag itself (see docs/deployment.md). Run by hand ("Run workflow")
# it does everything except publish, to try the build without a tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  publish:
    # Only for a real tag, never for a manual try-out, and only once publishing has been switched on.
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_IMAGES == 'true'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [api, front, bot]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/laviciacion-${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service }}
          push: true
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
