name: Deploy

# Deploys on demand (Actions tab -> Deploy -> Run workflow). It connects over SSH and the server holds the
# whole procedure; each key can run one script and nothing else (`command=` in its authorized_keys entry).
#   dev   builds main from the checkout of the dev stack (deploy.sh).
#   prod  builds a release tag on the server (`latest` = the newest vX.Y.Z tag, or e.g. 2.0.0). It refuses a tag
#         whose "Release images" run (every check) did not pass on the commit the tag points to.
#   dev   needs no such check: main only receives pull requests whose CI was green (branch protection).
# Each target has its own key (DEPLOY_SSH_KEY_DEV / DEPLOY_SSH_KEY_PROD); the host, the user and the host key are
# shared. A last job (notify) checks that the API answers and reports the result to Telegram.
# They are repository secrets, not environment secrets, on purpose: GitHub Free ignores environments
# (and their secrets) in a private repository, so this keeps working if the repository is ever made private.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        type: choice
        options: [dev, prod]
        default: dev
      version:
        description: "prod only: release to deploy, `latest` or X.Y.Z (also how you roll back)"
        type: string
        default: latest

permissions: {}

# Never two deploys at once; a second one waits for the first instead of cancelling it half-way.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy-dev:
    # The server pulls main whatever branch the run was started from; refuse to start from anything else.
    if: inputs.target == 'dev' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Run the dev deploy script on the server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY_DEV }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # No command is passed: the server runs deploy.sh whatever the client asks for.
          ssh -T -i ~/.ssh/deploy_key \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$HOST"

  deploy-prod:
    if: inputs.target == 'prod' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      # The server builds the tag itself, so nothing else would notice a release whose checks failed (or never ran).
      - name: The release passed every check
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          if ! printf '%s' "$VERSION" | grep -E -q '^(latest|[0-9]+\.[0-9]+\.[0-9]+)$'; then
            echo "::error::version must be 'latest' or X.Y.Z"; exit 1
          fi
          if [ "$VERSION" = latest ]; then
            tag=$(gh api "repos/$REPO/tags" --paginate --jq '.[].name' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          else
            tag="v$VERSION"
          fi
          [ -n "$tag" ] || { echo "::error::there is no release tag"; exit 1; }
          sha=$(gh api "repos/$REPO/commits/$tag" --jq .sha) || { echo "::error::the tag $tag does not exist"; exit 1; }
          passed=$(gh run list --repo "$REPO" --workflow release.yml --branch "$tag" --status success \
            --json headSha --jq "[.[] | select(.headSha == \"$sha\")] | length")
          if [ "$passed" = 0 ]; then
            echo "::error::$tag has no passing 'Release images' run on its commit ($sha). Wait for it, or run that workflow by hand on the tag."
            exit 1
          fi
          echo "$tag passed every check ($sha)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Run the prod deploy script on the server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY_PROD }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          VERSION: ${{ inputs.version }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The version is the only thing the client sends; the server checks it against a strict pattern.
          ssh -T -i ~/.ssh/deploy_key \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$HOST" "$VERSION"

  # Tells the group how the deploy ended. It runs after whichever deploy job was chosen (the other one is skipped) and
  # holds only the Telegram secrets, never the SSH keys. A deploy whose script succeeded still counts as failed here
  # if the public keepalive does not answer within a minute: the script only knows that the containers were started.
  notify:
    needs: [deploy-dev, deploy-prod]
    if: ${{ always() && (needs.deploy-dev.result != 'skipped' || needs.deploy-prod.result != 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check the API and notify Telegram
        env:
          TARGET: ${{ inputs.target }}
          DEV_RESULT: ${{ needs.deploy-dev.result }}
          PROD_RESULT: ${{ needs.deploy-prod.result }}
          PROD_TAG: ${{ needs.deploy-prod.outputs.tag }}
          URL_DEV: ${{ vars.DEPLOY_URL_DEV }}
          URL_PROD: ${{ vars.DEPLOY_URL_PROD }}
          INPUT_VERSION: ${{ inputs.version }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TELEGRAM_TOKEN: ${{ secrets.NOTIFY_TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.NOTIFY_TELEGRAM_CHAT_ID }}
        run: |
          if [ "$TARGET" = prod ]; then
            result=$PROD_RESULT
            base=$URL_PROD
            version=${PROD_TAG:-$INPUT_VERSION}
          else
            result=$DEV_RESULT
            base=$URL_DEV
            version="main@${SHA::7}"
          fi
          url="${base%/}/api/v1/keepalive"

          # The API restarts at the end of the deploy (and applies migrations first), so give it a minute.
          api=-
          if [ "$result" = success ]; then
            api=down
            for _ in $(seq 1 12); do
              if curl -fsS --max-time 10 "$url" | grep -q alive; then api=up; break; fi
              sleep 5
            done
          fi

          if [ "$result" != success ]; then
            ok=false; text="❌ Despliegue en $TARGET fallido ($result)"
          elif [ "$api" != up ]; then
            ok=false; text="⚠️ Desplegado en $TARGET, pero la API no responde"
          else
            ok=true; text="✅ Desplegado en $TARGET, la API responde"
          fi
          text="$text
          Versión: $version
          Lanzado por: $ACTOR
          $RUN_URL"

          curl -fsS --max-time 20 -o /dev/null \
            "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=$text" \
            --data-urlencode "disable_web_page_preview=true"

          # The deploy job is already red when it failed; this makes an unanswered API red too.
          [ "$ok" = true ]
