# Prometheus for the monitoring profile of docker-compose.yml: it only collects the machine's figures from node-exporter,
# which lives in the same Docker network.
global:
  scrape_interval: 30s

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ["laviciacion-node-exporter:9100"]

  # the API's own figures (requests, latency, in flight, process): /metrics is outside /api, so only the stack's network sees it
  - job_name: api
    static_configs:
      - targets: ["laviciacion-api:5000"]
